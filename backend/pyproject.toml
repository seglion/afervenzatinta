[tool.poetry]
name = "asociacion-backend"
version = "0.1.0"
description = "Backend para el sistema de gestión de la asociación."
authors = ["Tu Nombre <tu@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"  # <-- Actualizado a Python 3.12
asyncpg = "^0.28.0"  # aquí agregamos asyncpg
# Core de la aplicación
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncpg"], version = "^2.0.30"}
alembic = "^1.13.1"
pydantic = {extras = ["email"], version = "^2.7.1"}
pydantic-settings = "^2.2.1"

# Seguridad
argon2-cffi = "^23.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pyotp = "^2.9.0"  # Para 2FA (Fase 3)

# Tareas asíncronas
celery = "^5.4.0"
redis = "^5.0.4"

# Observabilidad y Logging
structlog = "^24.2.0"
prometheus-fastapi-instrumentator = "^7.0.0"

# Emails y comunicaciones
sendgrid = "^6.11.0"
psycopg2-binary = "^2.9.10"


[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.2.1"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"  # Cliente HTTP para tests de integración
factory-boy = "^3.3.0"
freezegun = "^1.5.0"
# Calidad de código
ruff = "^0.5.5"
black = "^24.4.2"
isort = "^5.13.2"
mypy = "^1.10.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.main.api"


# --- Configuración de Herramientas de Calidad ---
[tool.ruff]
line-length = 88
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = ["E501"] # Ignorar 'line too long', black se encarga de esto

[tool.ruff.format]
quote-style = "single"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
ignore_missing_imports = true
# No sigas imports que no puedes resolver (por ejemplo, de librerías sin tipos)
follow_imports = "silent"