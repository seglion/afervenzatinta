services:
  
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: fastapi_app
    volumes:
      - ../backend:/workspace/backend
    env_file:
      - ../backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: frontend_app
    volumes:
      - ../frontend:/workspace/frontend
    ports:
      - "5173:5173"  # si usas Vite
    depends_on:
      - app
  db:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: afervenzatinta
    volumes:
      - fervenzatinta_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  fervenzatinta_pgdata: {}